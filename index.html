    <script>
      (() => {
        const source = new Image()
        source.src = '/media/docc-favicon.png?v=4'
        source.onload = () => {
          const size = Math.min(source.naturalWidth, source.naturalHeight)
          const inset = Math.round(size * 0.045)
          const crop = size - inset * 2
          const canvas = document.createElement('canvas')
          canvas.width = 64
          canvas.height = 64
          const context = canvas.getContext('2d')
          if (!context) return
          context.drawImage(source, inset, inset, crop, crop, 0, 0, 64, 64)
          const icon = document.getElementById('docc-favicon')
          if (icon) icon.setAttribute('href', canvas.toDataURL('image/png'))
        }
      })()
    </script>
