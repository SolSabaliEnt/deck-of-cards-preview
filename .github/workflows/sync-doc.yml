name: Sync DOC Preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-doc.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: /tmp/doc-source/pnpm-lock.yaml

      - name: Fetch DOC source
        run: |
          git clone --depth 1 --branch main https://github.com/SolSabaliEnt/Deck-of-Cards.git /tmp/doc-source

      - name: Build DOC
        working-directory: /tmp/doc-source
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build

      - name: Publish build to preview root
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -R /tmp/doc-source/dist/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Preview is already current.'
          else
            git commit -m 'deploy: sync DOC main preview'
            git push origin main
          fi
